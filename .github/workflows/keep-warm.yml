name: keep-warm

# Vercel 서버리스 함수의 콜드 스타트를 줄이기 위해 프로덕션 API를 주기적으로 핑한다.
# /api/healthz/details 는 함수뿐 아니라 DB 연결까지 초기화하므로 콜드 스타트의 핵심을 워밍한다.
# 참고: GitHub Actions 스케줄은 최소 5분이며 부하 시 지연될 수 있어 콜드 스타트를 완전히
#      없애진 못하고 '줄이는' 목적이다. Vercel Pro 플랜이면 vercel.json crons가 더 정확하다.

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다
  workflow_dispatch: {} # 수동 실행

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm production (function + DB)
        env:
          URL: https://lucky-day-planner-hyuns-projects-e5de725e.vercel.app/api/healthz/details
        run: |
          # 첫 요청이 콜드 스타트 비용(최대 수십 초)을 흡수해 함수를 깨운다.
          # 킵웜은 best-effort라 실패해도 워크플로를 실패로 만들지 않는다(알림 노이즈 방지).
          for i in 1 2; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo "000")
            echo "ping #$i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "warm ok"
              exit 0
            fi
            sleep 15
          done
          echo "warm ping did not return 200 (best-effort, not failing the job)"
          exit 0
