openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Saju & Fortune website
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: saju
    description: Saju (Four Pillars of Destiny) operations
  - name: fortune
    description: Fortune and daily luck operations
  - name: manseryok
    description: Korean Almanac (Manseryok) operations
  - name: Auth
    description: Browser authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /saju/calculate:
    post:
      operationId: calculateSaju
      tags: [saju]
      summary: Calculate Saju (Four Pillars)
      description: Calculate the four pillars of destiny based on birth date and time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SajuRequest"
      responses:
        "200":
          description: Saju calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SajuResult"

  /fortune/daily:
    get:
      operationId: getDailyFortune
      tags: [fortune]
      summary: Get daily fortune (일진)
      description: Get today's fortune and luck information
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: Date in YYYY-MM-DD format (defaults to today)
        - name: birthYear
          in: query
          required: false
          schema:
            type: string
            description: Birth year for personalized fortune
        - name: birthMonth
          in: query
          required: false
          schema:
            type: string
            description: Birth month for personalized fortune
        - name: birthDay
          in: query
          required: false
          schema:
            type: string
            description: Birth day for personalized fortune
      responses:
        "200":
          description: Daily fortune result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFortune"

  /manseryok/date:
    get:
      operationId: getManseryokDate
      tags: [manseryok]
      summary: Get Manseryok info for a date
      description: Get Korean almanac (Manseryok) data for a specific date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
        - name: dayMasterElement
          in: query
          required: false
          schema:
            type: string
            description: Personalized day master element for relation-based scoring
        - name: dayMasterStem
          in: query
          required: false
          schema:
            type: string
        - name: dayMasterBranch
          in: query
          required: false
          schema:
            type: string
        - name: yearStem
          in: query
          required: false
          schema:
            type: string
        - name: yearBranch
          in: query
          required: false
          schema:
            type: string
        - name: monthStem
          in: query
          required: false
          schema:
            type: string
        - name: monthBranch
          in: query
          required: false
          schema:
            type: string
        - name: hourStem
          in: query
          required: false
          schema:
            type: string
        - name: hourBranch
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Manseryok date info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManseryokDate"

  /manseryok/month:
    get:
      operationId: getManseryokMonth
      tags: [manseryok]
      summary: Get Manseryok info for a month
      description: Get Korean almanac data for a full month
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: true
          schema:
            type: string
        - name: dayMasterElement
          in: query
          required: false
          schema:
            type: string
            description: Personalized day master element for relation-based scoring
        - name: dayMasterStem
          in: query
          required: false
          schema:
            type: string
        - name: dayMasterBranch
          in: query
          required: false
          schema:
            type: string
        - name: yearStem
          in: query
          required: false
          schema:
            type: string
        - name: yearBranch
          in: query
          required: false
          schema:
            type: string
        - name: monthStem
          in: query
          required: false
          schema:
            type: string
        - name: monthBranch
          in: query
          required: false
          schema:
            type: string
        - name: hourStem
          in: query
          required: false
          schema:
            type: string
        - name: hourBranch
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Manseryok month info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManseryokMonth"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      responses:
        "302":
          description: Redirect to OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect after login.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear session and begin OIDC logout
      responses:
        "302":
          description: Redirect to OIDC provider logout URL.

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SajuRequest:
      type: object
      properties:
        birthYear:
          type: integer
          description: Birth year (e.g. 1990)
        birthMonth:
          type: integer
          description: Birth month (1-12)
        birthDay:
          type: integer
          description: Birth day (1-31)
        birthHour:
          type: integer
          description: Birth hour in 24h format (0-23), -1 if unknown
        birthMinute:
          type: integer
          description: Birth minute (0-59)
        gender:
          type: string
          enum: [male, female]
          description: Gender for fortune calculation
        calendarType:
          type: string
          enum: [solar, lunar]
          description: Whether birth date is in solar or lunar calendar
        isLeapMonth:
          type: boolean
          description: Whether a lunar birth date uses the intercalary month
        birthPlace:
          type: string
          description: Human-readable birthplace label
        timeZone:
          type: string
          description: IANA timezone used for historical civil-time conversion
        longitude:
          type: number
          description: Birthplace longitude in degrees east
        latitude:
          type: number
          description: Birthplace latitude in degrees north
        applyTrueSolarTime:
          type: boolean
          description: Apply longitude, historical DST, and equation-of-time correction
        dayBoundary:
          type: string
          enum: [midnight, late-zi]
          description: Day-pillar boundary rule for the late Zi hour
      required:
        - birthYear
        - birthMonth
        - birthDay
        - gender
        - calendarType

    SajuPillar:
      type: object
      properties:
        heavenlyStem:
          type: string
          description: Heavenly stem (천간)
        earthlyBranch:
          type: string
          description: Earthly branch (지지)
        heavenlyStemElement:
          type: string
          description: Five element of heavenly stem (오행)
        earthlyBranchElement:
          type: string
          description: Five element of earthly branch (오행)
        heavenlyStemKorean:
          type: string
        earthlyBranchKorean:
          type: string
        zodiac:
          type: string
          description: Zodiac animal (띠)
      required:
        - heavenlyStem
        - earthlyBranch
        - heavenlyStemElement
        - earthlyBranchElement
        - heavenlyStemKorean
        - earthlyBranchKorean
        - zodiac

    ElementCount:
      type: object
      properties:
        wood:
          type: integer
        fire:
          type: integer
        earth:
          type: integer
        metal:
          type: integer
        water:
          type: integer
      required:
        - wood
        - fire
        - earth
        - metal
        - water

    SajuBirthInfo:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        day:
          type: integer
        hour:
          type: integer
        minute:
          type: integer
        gender:
          type: string
        calendarType:
          type: string
        isLeapMonth:
          type: boolean
        birthPlace:
          type: string
        timeZone:
          type: string
        longitude:
          type: number
        latitude:
          type: number
          nullable: true
        applyTrueSolarTime:
          type: boolean
        dayBoundary:
          type: string
      required:
        - year
        - month
        - day
        - hour
        - gender
        - calendarType

    SajuShadowReading:
      type: object
      properties:
        title:
          type: string
          description: Balanced section title for difficult patterns and cautions
        summary:
          type: string
          description: Concise summary of negative patterns when strengths are overused
        pitfalls:
          type: array
          items:
            type: string
          description: Specific caution points and repeated failure patterns
        advice:
          type: string
          description: Practical balancing advice
      required:
        - title
        - summary
        - pitfalls
        - advice

    SajuSpecialSummaryBranchInfo:
      type: object
      properties:
        branches:
          type: array
          items:
            type: string
          description: Korean branch letters
        branchesHanja:
          type: array
          items:
            type: string
          description: Hanja branch letters
        label:
          type: string
          description: Compact hanja branch label
        foundIn:
          type: array
          items:
            type: string
          description: Pillar branches where the target appears
      required:
        - branches
        - branchesHanja
        - label
        - foundIn

    SajuSpecialSummary:
      type: object
      properties:
        elementLine:
          type: string
          description: Compact five-element count line
        detailLine:
          type: string
          description: Compact gongmang, cheoneul guin, and month command line
        gongmang:
          type: object
          properties:
            year:
              $ref: "#/components/schemas/SajuSpecialSummaryBranchInfo"
            day:
              $ref: "#/components/schemas/SajuSpecialSummaryBranchInfo"
          required:
            - year
            - day
        cheoneulGuin:
          $ref: "#/components/schemas/SajuSpecialSummaryBranchInfo"
        monthCommand:
          type: object
          properties:
            stem:
              type: string
            stemHanja:
              type: string
            branch:
              type: string
            branchHanja:
              type: string
            elapsedDays:
              type: integer
            label:
              type: string
          required:
            - stem
            - stemHanja
            - branch
            - branchHanja
            - elapsedDays
            - label
      required:
        - elementLine
        - detailLine
        - gongmang
        - cheoneulGuin
        - monthCommand

    SajuResult:
      type: object
      properties:
        birthInfo:
          $ref: "#/components/schemas/SajuBirthInfo"
        calculationBasis:
          type: object
          additionalProperties: true
          description: Calendar conversion, historical time-zone, true-solar-time, and day-boundary calculation evidence
        yearPillar:
          $ref: "#/components/schemas/SajuPillar"
        monthPillar:
          $ref: "#/components/schemas/SajuPillar"
        dayPillar:
          $ref: "#/components/schemas/SajuPillar"
        hourPillar:
          $ref: "#/components/schemas/SajuPillar"
        elementBalance:
          $ref: "#/components/schemas/ElementCount"
        specialSummary:
          $ref: "#/components/schemas/SajuSpecialSummary"
        dominantElement:
          type: string
          description: The strongest element in the chart
        lackingElement:
          type: string
          description: The weakest element in the chart
        dayMasterElement:
          type: string
          description: The day master element
        personality:
          type: string
          description: Personality description based on saju
        fortune:
          type: string
          description: Overall fortune description
        shadowReading:
          $ref: "#/components/schemas/SajuShadowReading"
        career:
          type: string
          description: Career fortune
        love:
          type: string
          description: Love and relationship fortune
        health:
          type: string
          description: Health fortune
        luckyNumbers:
          type: array
          items:
            type: integer
        luckyColors:
          type: array
          items:
            type: string
        luckyDirections:
          type: array
          items:
            type: string
        zodiac:
          type: string
        lunarBirthDate:
          type: string
          description: Lunar calendar date if input was solar
        hiddenStemAnalysis:
          type: object
          additionalProperties: true
          description: Weighted hidden stems, rooting, penetration, and day-master strength evidence
        multiYongsinAnalysis:
          type: object
          additionalProperties: true
          description: Cross-check of eokbu, johu, tonggwan, byeongyak, and simple balance useful-god methods
        stemTransformationAnalysis:
          type: object
          additionalProperties: true
          description: Heavenly-stem combination and transformation prerequisites
        familyRoleAnalysis:
          type: object
          additionalProperties: true
          description: Role-specific six-relatives and palace analysis
        daeunTransitionAnalysis:
          type: object
          additionalProperties: true
          description: Exact ten-year-luck transition dates and transition windows
        integratedLuckTimeline:
          type: object
          additionalProperties: true
          description: Layered ten-year, annual, monthly, daily, and hourly timing
        birthTimeCandidateAnalysis:
          description: Twelve-hour candidate comparison when birth time is unknown
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required:
        - yearPillar
        - monthPillar
        - dayPillar
        - elementBalance
        - specialSummary
        - dominantElement
        - lackingElement
        - dayMasterElement
        - personality
        - fortune
        - shadowReading
        - career
        - love
        - health
        - luckyNumbers
        - luckyColors
        - luckyDirections
        - zodiac

    DailyFortune:
      type: object
      properties:
        date:
          type: string
        lunarDate:
          type: string
          description: Lunar calendar date
        dayGanzi:
          type: string
          description: Day's heavenly stem and earthly branch (일진)
        dayHeavenlyStem:
          type: string
        dayEarthlyBranch:
          type: string
        dayElement:
          type: string
        dayZodiac:
          type: string
        overallScore:
          type: integer
          description: Overall luck score (0-100)
        overallFortune:
          type: string
          description: Overall fortune description
        moneyScore:
          type: integer
        moneyFortune:
          type: string
        loveScore:
          type: integer
        loveFortune:
          type: string
        careerScore:
          type: integer
          description: Career luck score
        careerFortune:
          type: string
        healthScore:
          type: integer
        healthFortune:
          type: string
        luckyHours:
          type: array
          items:
            type: string
          description: Lucky hours of the day
        luckyColors:
          type: array
          items:
            type: string
        luckyNumbers:
          type: array
          items:
            type: integer
        luckyDirection:
          type: string
        avoidDirection:
          type: string
        advice:
          type: string
          description: Daily advice
        monthGanzi:
          type: string
        yearGanzi:
          type: string
        goodThings:
          type: array
          description: Recommended activities for today
          items:
            type: string
        avoidThings:
          type: array
          description: Activities to avoid today
          items:
            type: string
      required:
        - date
        - lunarDate
        - dayGanzi
        - dayHeavenlyStem
        - dayEarthlyBranch
        - dayElement
        - dayZodiac
        - overallScore
        - overallFortune
        - moneyScore
        - moneyFortune
        - loveScore
        - loveFortune
        - careerScore
        - careerFortune
        - healthScore
        - healthFortune
        - luckyHours
        - luckyColors
        - luckyNumbers
        - luckyDirection
        - avoidDirection
        - advice
        - monthGanzi
        - yearGanzi
        - goodThings
        - avoidThings

    ManseryokDay:
      type: object
      properties:
        solar:
          type: string
          description: Solar date (YYYY-MM-DD)
        lunar:
          type: string
          description: Lunar date (MM-DD)
        lunarMonth:
          type: integer
          description: Lunar month number
        lunarDay:
          type: integer
          description: Lunar day number
        lunarLeap:
          type: boolean
          description: Is this a leap month
        noSonDay:
          type: boolean
          description: Traditional 손없는날 based on lunar day ending in 9 or 0
        holiday:
          type: string
          description: Public holiday name from KASI public data when available
        dayGanzi:
          type: string
          description: Day's ganzi (천간지지)
        dayHeavenlyStem:
          type: string
        dayEarthlyBranch:
          type: string
        dayElement:
          type: string
        dayZodiac:
          type: string
        solarTerm:
          type: string
          description: Solar term (절기) if applicable
        luckyDay:
          type: boolean
        inauspiciousDay:
          type: boolean
        dayDescription:
          type: string
        personalized:
          $ref: "#/components/schemas/ManseryokPersonalized"
      required:
        - solar
        - lunar
        - lunarMonth
        - lunarDay
        - lunarLeap
        - noSonDay
        - dayGanzi
        - dayHeavenlyStem
        - dayEarthlyBranch
        - dayElement
        - dayZodiac
        - luckyDay
        - inauspiciousDay

    ManseryokPersonalizedBadges:
      type: object
      properties:
        lucky:
          type: boolean
        inauspicious:
          type: boolean
        caution:
          type: boolean
        genericLucky:
          type: boolean
        genericCaution:
          type: boolean
      required:
        - lucky
        - inauspicious
        - caution
        - genericLucky
        - genericCaution

    ManseryokPersonalizedRelation:
      type: object
      properties:
        type:
          type: string
        label:
          type: string
        fortune:
          type: string
        why:
          type: string
        colorClass:
          type: string
        borderClass:
          type: string
        emoji:
          type: string
        score:
          type: integer
        positive:
          type: boolean
      required:
        - type
        - label
        - fortune
        - why
        - colorClass
        - borderClass
        - emoji
        - score
        - positive

    ManseryokPersonalized:
      type: object
      properties:
        score:
          type: integer
        label:
          type: string
        relation:
          anyOf:
            - $ref: "#/components/schemas/ManseryokPersonalizedRelation"
            - type: "null"
        badges:
          $ref: "#/components/schemas/ManseryokPersonalizedBadges"
      required:
        - score
        - label
        - badges

    ManseryokDate:
      type: object
      properties:
        day:
          $ref: "#/components/schemas/ManseryokDay"
        yearGanzi:
          type: string
        monthGanzi:
          type: string
        yearElement:
          type: string
        monthElement:
          type: string
        yearZodiac:
          type: string
        calendarDataSource:
          type: string
          enum: [kasi, partial, local]
        calendarDataMessage:
          type: string
      required:
        - day
        - yearGanzi
        - monthGanzi
        - yearElement
        - monthElement
        - yearZodiac
        - calendarDataSource
        - calendarDataMessage

    ManseryokMonth:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        yearGanzi:
          type: string
        monthGanzi:
          type: string
        yearZodiac:
          type: string
        calendarDataSource:
          type: string
          enum: [kasi, partial, local]
        calendarDataMessage:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/ManseryokDay"
      required:
        - year
        - month
        - yearGanzi
        - monthGanzi
        - yearZodiac
        - calendarDataSource
        - calendarDataMessage
        - days

    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        role:
          type: string
          nullable: true

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
